[project]
name = "yolo-embarque"
version = "0.0.1"
description = "Tiny-YOLOv2/v3 réécrits à la main en NumPy : modèle de référence flottant et entier bit-exact"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "jsonschema>=4", "pyyaml>=6"]
data = ["pillow>=10"]
coco = ["pycocotools>=2"]  # vérification de yolo.infer.coco_eval seulement (T11.1)

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yolo*"]

[tool.setuptools.package-data]
"yolo.models" = ["cfg/*.cfg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: tests longs (surapprentissage, T2.8) ; lancer avec -m slow"]

[tool.ruff]
line-length = 100
