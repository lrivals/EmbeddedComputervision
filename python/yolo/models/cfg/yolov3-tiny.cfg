# Tiny-YOLOv3, COCO (80 classes)
# Source : Darknet, yolov3-tiny.cfg (https://github.com/pjreddie/darknet/tree/master/cfg) — HORS BASE.
# COCO (80 classes), pour charger yolov3-tiny.weights (T1.9). Masque 1,2,3 de la 2e tête
# repris tel quel de l'original Darknet (la tête 26×26 n'y utilise pas l'ancre 0).
# Numérotation des couches = tableaux du §3 de la spec.

[net]
batch=64
subdivisions=2
width=416
height=416
channels=3
momentum=0.9
decay=0.0005
angle=0
saturation=1.5
exposure=1.5
hue=.1

learning_rate=0.001
# 0
[convolutional]
batch_normalize=1
filters=16
size=3
stride=1
pad=1
activation=leaky

# 1
[maxpool]
size=2
stride=2

# 2
[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

# 3
[maxpool]
size=2
stride=2

# 4
[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=leaky

# 5
[maxpool]
size=2
stride=2

# 6
[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

# 7
[maxpool]
size=2
stride=2

# 8
[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

# 9
[maxpool]
size=2
stride=2

# 10
[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

# 11 : stride 1, taille 13×13 conservée (§4.4)
[maxpool]
size=2
stride=1

# 12
[convolutional]
batch_normalize=1
filters=1024
size=3
stride=1
pad=1
activation=leaky

# 13 : lue par 14 et par la route 17
[convolutional]
batch_normalize=1
filters=256
size=1
stride=1
pad=1
activation=leaky

# 14
[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

# 15 : 3 × (5 + 80)
[convolutional]
filters=255
size=1
stride=1
pad=1
activation=linear

# 16 : grandes ancres, 13×13
[yolo]
mask = 3,4,5
anchors = 10,14,  23,27,  37,58,  81,82,  135,169,  344,319
classes=80
num=6
jitter=.3
ignore_thresh=.7
truth_thresh=1
random=1

# 17
[route]
layers = -4

# 18
[convolutional]
batch_normalize=1
filters=128
size=1
stride=1
pad=1
activation=leaky

# 19
[upsample]
stride=2

# 20 : concaténation 19, 8 (§3.2)
[route]
layers = -1, 8

# 21
[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

# 22 : 3 × (5 + 80)
[convolutional]
filters=255
size=1
stride=1
pad=1
activation=linear

# 23 : petites ancres, 26×26
[yolo]
mask = 1,2,3
anchors = 10,14,  23,27,  37,58,  81,82,  135,169,  344,319
classes=80
num=6
jitter=.3
ignore_thresh=.7
truth_thresh=1
random=1
