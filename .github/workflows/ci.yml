# Intégration continue (T10.13, T10.14) : ni Vitis, ni carte, ni VOC, ni poids Darknet.
# model/ est un export synthétique (tools/make_ci_model.py) : mêmes formes que les vrais
# réseaux, donc golden == C-sim à l'octet et cycles C-sim == perf_model restent vérifiés.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++
          pip install -e "python[dev,data]"

      - name: Export synthétique
        run: make ci-model

      - name: Lint, golden, C-sim, driver, perf-model, pytest
        run: make ci
